name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

# Required for npm provenance — links the published tarball to this workflow run.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Full gate: typecheck, tests, build.
      - name: Verify
        run: npm run verify

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Catches a malformed exports map, missing files, or a wrong main/module
      # before consumers do.
      # --pack npm is required: yarn.lock makes publint default to `yarn pack`,
      # which drops the gitignored dist/ and reports it as missing.
      - name: Package validity
        run: npx --yes publint@latest --pack npm

      # The wizard ships no runtime dependencies, so no advisory can reach a
      # consumer through it. Asserting that keeps it true.
      - name: Assert no runtime dependencies
        run: |
          COUNT=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          echo "runtime dependencies: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "::error::This package must have zero runtime dependencies."
            exit 1
          fi

      # Vue must stay a peer import. Asserting the import exists is the real
      # test; grepping for Vue identifiers would match the import names
      # themselves and pass only when Vue *is* bundled.
      - name: Assert Vue is external
        run: |
          grep -q 'from *"vue"' dist/vue3-form-wizard.es.js \
            || { echo "::error::ES bundle does not import from \"vue\" - Vue may have been inlined."; exit 1; }
          grep -q 'require("vue")' dist/vue3-form-wizard.umd.js \
            || { echo "::error::UMD bundle does not require \"vue\" - Vue may have been inlined."; exit 1; }
          SIZE=$(wc -c < dist/vue3-form-wizard.es.js)
          echo "ES bundle: $SIZE bytes"
          if [ "$SIZE" -gt 120000 ]; then
            echo "::error::ES bundle is $SIZE bytes; Vue was probably inlined."
            exit 1
          fi
          echo "OK: Vue is external"

      # Separated from the publish so an auth problem reports itself instead of
      # surfacing as a generic npm error at the last step.
      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty in this job. An environment secret must live in the environment this job declares (currently 'npm'); a repository secret needs no environment."
            exit 1
          fi
          echo "token length: ${#NODE_AUTH_TOKEN}"
          npm whoami || {
            echo "::error::npm rejected NPM_TOKEN. Use an Automation token, or a granular token with Read and write access to this package."
            exit 1
          }

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set +e
          OUT=$(npm publish --provenance --access public --tag "$DIST_TAG" 2>&1)
          CODE=$?
          echo "$OUT"

          if [ $CODE -eq 0 ]; then
            exit 0
          fi

          # An OTP prompt means the token type is wrong, not that the publish is
          # retryable. Only Automation tokens bypass 2FA on write.
          if echo "$OUT" | grep -q "EOTP"; then
            echo "::error::npm asked for a one-time password. NPM_TOKEN must be an *Automation* token - granular and classic Publish tokens still require 2FA. Regenerate at npmjs.com > Access Tokens > Generate New Token > Automation, then update the NPM_TOKEN secret."
            exit 1
          fi

          if echo "$OUT" | grep -q "E403"; then
            echo "::error::npm rejected the publish as forbidden. The token authenticates but lacks write access to this package."
            exit 1
          fi

          echo "::warning::Publish with provenance failed; retrying without it."
          npm publish --access public --tag "$DIST_TAG"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Lifts this version's section straight out of CHANGES.md.
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGES.md entry found for $VERSION." > release-notes.md
          fi
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
