name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  package:
    name: Package validity
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # --pack npm is required: yarn.lock makes publint default to `yarn pack`,
      # which drops the gitignored dist/ and reports it as missing.
      - name: publint
        run: npx --yes publint@latest --pack npm

      # Reporting only, deliberately. Two pre-existing packaging defects fail
      # this today, and neither is safe to fix without a breaking change:
      #   1. exports["."].require points at dist/vue3-form-wizard.umd.js, but
      #      "type": "module" makes Node read that .js as ESM, so require()
      #      resolves to ESM. Fixing it means emitting a .cjs alongside the
      #      .umd.js, which CDN consumers link to directly.
      #   2. The emitted .d.ts files import .vue paths that do not resolve.
      # Left visible so the report is on every run rather than forgotten.
      - name: Are the types wrong? (report only)
        continue-on-error: true
        run: npx --yes @arethetypeswrong/cli@latest --pack . --exclude-entrypoints dist/style.css dist/vue3-form-wizard.css

      - name: Assert no runtime dependencies
        run: |
          COUNT=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          echo "runtime dependencies: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "::error::This package must have zero runtime dependencies."
            exit 1
          fi

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # Vue must stay a peer import. Asserting the import exists is the real
      # test; grepping for Vue identifiers would match the import names
      # themselves and pass only when Vue *is* bundled.
      - name: Assert Vue is external
        run: |
          grep -q 'from *"vue"' dist/vue3-form-wizard.es.js \
            || { echo "::error::ES bundle does not import from \"vue\" - Vue may have been inlined."; exit 1; }
          grep -q 'require("vue")' dist/vue3-form-wizard.umd.js \
            || { echo "::error::UMD bundle does not require \"vue\" - Vue may have been inlined."; exit 1; }
          SIZE=$(wc -c < dist/vue3-form-wizard.es.js)
          echo "ES bundle: $SIZE bytes"
          if [ "$SIZE" -gt 120000 ]; then
            echo "::error::ES bundle is $SIZE bytes; Vue was probably inlined."
            exit 1
          fi
          echo "OK: Vue is external"

      # The stylesheet is a published entry point; an empty one ships a wizard
      # with no styling at all.
      - name: Assert the stylesheet was emitted
        run: |
          test -s dist/vue3-form-wizard.css || { echo "::error::dist/vue3-form-wizard.css is missing or empty"; exit 1; }
          echo "OK: stylesheet present"

      - name: Pack tarball
        run: npm pack --pack-destination .

      - uses: actions/upload-artifact@v5
        with:
          name: tarball
          path: ./*.tgz
          retention-days: 1
